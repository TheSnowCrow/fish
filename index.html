<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dino & Truck Letter Tracer</title>
    <style>
        /* --- Core Layout & Reset --- */
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f8ff; /* AliceBlue */
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            overflow: hidden; /* Prevent scrolling */
            touch-action: none; /* Prevent mobile gestures */
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* --- UI Elements --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let touches pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            z-index: 10;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .btn {
            background: #FFD700; /* Gold */
            border: 4px solid #ff8c00;
            border-radius: 15px;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 0 #b86500;
            transition: transform 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        
        .sound-btn { font-size: 1.5rem; padding: 5px 15px; }

        #progress-display {
            font-size: 1.5rem;
            color: #333;
            background: rgba(255,255,255,0.8);
            padding: 5px 15px;
            border-radius: 20px;
            border: 2px solid #333;
        }

        /* --- Overlay Screens --- */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
            text-align: center;
            color: white;
        }
        .hidden { display: none !important; }
        
        h1 { font-size: 3rem; color: #FFD700; text-shadow: 4px 4px #ff4500; margin-bottom: 10px; }
        p { font-size: 1.5rem; margin-bottom: 30px; max-width: 80%; }
        .big-start-btn {
            font-size: 2rem;
            padding: 20px 60px;
            background-color: #32CD32; /* LimeGreen */
            border-color: #006400;
            color: white;
            box-shadow: 0 6px 0 #004d00;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* --- Reward Animations --- */
        #reward-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
            display: none;
        }
        .reward-emoji {
            position: absolute;
            font-size: 8rem;
        }
        
        /* Truck Drive Animation */
        .drive-across {
            bottom: 10%;
            left: -20%;
            animation: drive 3s linear forwards;
        }
        @keyframes drive {
            0% { left: -20%; transform: rotate(0deg); }
            20% { transform: rotate(-5deg) translateY(-10px); } /* Bump */
            40% { transform: rotate(5deg) translateY(0px); }
            60% { transform: rotate(-2deg) translateY(-5px); }
            100% { left: 120%; }
        }

        /* Dino Stomp Animation */
        .stomp-center {
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: stomp 3s ease-out forwards;
        }
        @keyframes stomp {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            25% { transform: translate(-50%, -50%) scale(1.2); }
            30% { transform: translate(-50%, -50%) scale(1.5); }
            80% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }

        /* Excavator Dig Animation */
        .dig-anim {
            bottom: 0; right: -10%;
            transform-origin: bottom right;
            animation: dig 3s ease-in-out forwards;
        }
        @keyframes dig {
            0% { right: -50%; }
            30% { right: 10%; transform: rotate(0deg); }
            50% { transform: rotate(-20deg); } /* Scoop */
            70% { transform: rotate(0deg); }
            100% { right: 120%; }
        }

        .praise-text {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            font-size: 4rem;
            font-weight: 900;
            color: #FF4500;
            text-shadow: 3px 3px 0 #FFF;
            animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* --- Canvas --- */
        canvas {
            display: block;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 20px;
            margin: auto;
        }
    </style>
</head>
<body>

    <div id="start-screen" class="overlay">
        <h1>Let's Write!</h1>
        <p>Dinosaurs, Trucks, and Construction Vehicles are waiting for you!</p>
        <button class="btn big-start-btn" onclick="startGame()">START</button>
    </div>

    <div id="ui-layer" class="hidden">
        <div class="top-bar">
            <div id="progress-display">A</div>
            <button class="btn" onclick="resetLetter()">↺ Clear</button>
        </div>
        <div class="top-bar" style="justify-content: flex-end; margin-top: auto;">
             <button id="sound-toggle" class="btn sound-btn" onclick="toggleSound()">🔊</button>
        </div>
    </div>

    <div id="reward-container"></div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Game Configuration ---
        const COLORS = {
            bg: '#FFFFFF',
            outline: '#E0E0E0',
            fill: '#FF4500', // Orange-Red for the trace
            guide: '#000000' // Hidden guide color
        };
        
        const REWARDS = [
            { type: 'truck', emoji: '🛻', class: 'drive-across', sound: 'vroom' },
            { type: 'dino', emoji: '🦖', class: 'stomp-center', sound: 'roar' },
            { type: 'construction', emoji: '🚜', class: 'dig-anim', sound: 'clank' },
            { type: 'dino2', emoji: '🦕', class: 'stomp-center', sound: 'roar' },
            { type: 'truck2', emoji: '🚒', class: 'drive-across', sound: 'vroom' }
        ];
        
        const PRAISES = ["AWESOME!", "GREAT JOB!", "WOW!", "YOU DID IT!", "SUPER!"];
        const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');

        // --- State ---
        let currentLetterIndex = 0;
        let isDrawing = false;
        let soundEnabled = true;
        let isLocked = false; // Locked during success animation
        let canvas, ctx;
        let lastX, lastY;
        let totalPixels = 0; // Total pixels inside the letter
        
        // Setup
        window.onload = init;
        window.addEventListener('resize', resizeCanvas);

        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            // Handle Input
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault(); 
                startDraw(e.touches[0]);
            }, { passive: false });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault(); 
                draw(e.touches[0]);
            }, { passive: false });
            canvas.addEventListener('touchend', endDraw);

            resizeCanvas();
        }

        function resizeCanvas() {
            // Make canvas fit screen minus some padding
            const margin = 20;
            canvas.width = window.innerWidth - margin;
            canvas.height = window.innerHeight - margin;
            if (currentLetterIndex >= 0) loadLetter(currentLetterIndex);
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');
            
            // Unlock AudioContext for mobile browsers
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(utterance);
            }

            currentLetterIndex = 0;
            loadLetter(0);
        }

        function loadLetter(index) {
            if (index >= LETTERS.length) {
                // Game Over / Loop
                currentLetterIndex = 0;
                index = 0;
            }

            const letter = LETTERS[index];
            document.getElementById('progress-display').innerText = `${letter} (${index + 1}/26)`;

            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over';

            // 1. Draw the "Guide" (The Gray Letter)
            ctx.font = `bold ${canvas.height * 0.7}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = COLORS.outline;
            ctx.fillText(letter, canvas.width / 2, canvas.height / 2);

            // 2. Calculate "pixel volume" of the letter for success checking
            // We take a snapshot of the letter pixels to know how much "ink" is required
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            totalPixels = 0;
            // Count non-transparent pixels (alpha > 0)
            for (let i = 3; i < data.length; i += 4) {
                if (data[i] > 0) totalPixels++;
            }

            // Audio Prompt
            if (soundEnabled) speak(`Letter ${letter}`);
        }

        function resetLetter() {
            if (isLocked) return;
            loadLetter(currentLetterIndex);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-toggle');
            btn.innerText = soundEnabled ? "🔊" : "🔇";
        }

        // --- Drawing Logic ---

        function startDraw(e) {
            if (isLocked) return;
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        }

        function draw(e) {
            if (!isDrawing || isLocked) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Magic: 'source-atop' ensures we ONLY draw where pixels already exist (the gray letter)
            // This acts as a natural mask. The child cannot color outside the lines.
            ctx.globalCompositeOperation = 'source-atop';
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = COLORS.fill;
            ctx.lineWidth = canvas.height * 0.08; // Brush size relative to screen
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            lastX = x;
            lastY = y;
        }

        function endDraw() {
            if (!isDrawing || isLocked) return;
            isDrawing = false;
            checkSuccess();
        }

        function checkSuccess() {
            // Get image data again to count Orange pixels
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            let filledPixels = 0;

            // Check for our fill color (OrangeRed: R=255, G=69, B=0)
            // We allow some tolerance in color matching due to anti-aliasing
            for (let i = 0; i < data.length; i += 4) {
                // If pixel is reddish/orange
                if (data[i] > 200 && data[i+1] < 100) {
                    filledPixels++;
                }
            }

            // Determine Percentage
            const percentage = (filledPixels / totalPixels) * 100;

            // Threshold: 85% coverage is "Success" for a kid
            if (percentage > 85) {
                triggerSuccess();
            }
        }

        // --- Rewards System ---

        function triggerSuccess() {
            isLocked = true; // Stop drawing
            
            // 1. Audio Praise
            if (soundEnabled) {
                const randomPraise = PRAISES[Math.floor(Math.random() * PRAISES.length)];
                speak(randomPraise);
            }

            // 2. Visual Rewards
            const container = document.getElementById('reward-container');
            container.style.display = 'block';
            container.innerHTML = ''; // Clear previous

            // Pick random reward theme
            const theme = REWARDS[Math.floor(Math.random() * REWARDS.length)];
            
            // Create Emoji Element
            const el = document.createElement('div');
            el.innerText = theme.emoji;
            el.className = `reward-emoji ${theme.class}`;
            container.appendChild(el);

            // Add Praise Text
            const text = document.createElement('div');
            text.innerText = PRAISES[Math.floor(Math.random() * PRAISES.length)];
            text.className = 'praise-text';
            container.appendChild(text);

            // Create Confetti
            createConfetti();

            // 3. Advance Level after animation
            setTimeout(() => {
                container.style.display = 'none';
                isLocked = false;
                currentLetterIndex++;
                loadLetter(currentLetterIndex);
            }, 3500);
        }

        // Basic Web Speech API wrapper
        function speak(text) {
            if ('speechSynthesis' in window) {
                // Cancel any currently speaking text
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9; // Slightly slower for kids
                utterance.pitch = 1.1; // Slightly higher
                window.speechSynthesis.speak(utterance);
            }
        }

        // Simple Canvas Confetti
        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff'];
            const count = 50;
            const container = document.getElementById('reward-container');
            
            for (let i = 0; i < count; i++) {
                const conf = document.createElement('div');
                conf.style.position = 'absolute';
                conf.style.width = '15px';
                conf.style.height = '15px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = Math.random() * 100 + '%';
                conf.style.top = '-20px';
                // Random animation fall
                conf.style.transition = `top ${1 + Math.random() * 2}s ease-in, transform ${2}s linear`;
                conf.style.zIndex = 40;
                
                container.appendChild(conf);

                // Trigger animation next frame
                requestAnimationFrame(() => {
                    conf.style.top = '110%';
                    conf.style.transform = `rotate(${Math.random() * 360}deg)`;
                });
            }
        }
    </script>
</body>
</html>
